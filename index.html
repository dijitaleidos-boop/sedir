<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C48">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Sedir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding:env(safe-area-inset-top,0px) 0 0}
/* Yerleşim: telefonda tek sütun + altta 5'li gezinme; geniş ekranda solda sabit menü, içerik en çok 1040px.
   Renk: şişe yeşili (kadife döşeme) + keten grisi zemin. Durum renkleri (amber/kırmızı/mavi) ayrı tutulur. */
:root{
  --zemin:#F2F4EE; --yuzey:#FFFFFF; --yuzey2:#E8ECE3; --cizgi:#D5DACF;
  --murekkep:#17201C; --soluk:#55615B;
  --ana:#1F5C48; --ana-koyu:#164536; --ana-acik:#DFECE5; --ana-ustu:#FFFFFF;
  --amber:#8A5206; --amber-z:#FAEDD3;
  --kirmizi:#A33526; --kirmizi-z:#F8E2DD;
  --mavi:#28557F; --mavi-z:#DFEAF4;
  --golge:0 1px 2px rgba(23,32,28,.06), 0 8px 24px rgba(23,32,28,.07);
  --perde:rgba(23,32,28,.5);
  --f-baslik:'Bricolage Grotesque','Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-govde:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px; --r-k:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --zemin:#101513; --yuzey:#19201D; --yuzey2:#232C28; --cizgi:#34403A;
    --murekkep:#ECF1EC; --soluk:#A0ADA6;
    --ana:#62BC98; --ana-koyu:#7BCBAA; --ana-acik:#1C3229; --ana-ustu:#0B1A13;
    --amber:#E6B15A; --amber-z:#382B12;
    --kirmizi:#EC8E7E; --kirmizi-z:#3A1D18;
    --mavi:#8DB8E4; --mavi-z:#192A3B;
    --golge:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --perde:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --zemin:#101513; --yuzey:#19201D; --yuzey2:#232C28; --cizgi:#34403A;
  --murekkep:#ECF1EC; --soluk:#A0ADA6;
  --ana:#62BC98; --ana-koyu:#7BCBAA; --ana-acik:#1C3229; --ana-ustu:#0B1A13;
  --amber:#E6B15A; --amber-z:#382B12;
  --kirmizi:#EC8E7E; --kirmizi-z:#3A1D18;
  --mavi:#8DB8E4; --mavi-z:#192A3B;
  --golge:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --perde:rgba(0,0,0,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--zemin);color:var(--murekkep);font:16px/1.45 var(--f-govde);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%;display:block}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-baslik);text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.15;font-weight:700}
h2{font-size:19px;line-height:1.25;font-weight:600}
h3{font-size:16px;font-weight:600}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ana);outline-offset:2px}
.ik{flex:none}
.kucuk{font-size:14px;color:var(--soluk)}
.etiket{font-size:13px;font-weight:600;color:var(--soluk);text-transform:uppercase;letter-spacing:.06em}
.sayi{font-variant-numeric:tabular-nums}
.sec{user-select:all}

/* ---------- kabuk ---------- */
.kabuk{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.yan{display:none}
.icerik{width:100%;max-width:1040px;margin-inline:auto;padding-inline:16px;padding-block:18px 104px;min-width:0;display:flex;flex-direction:column;gap:18px}
.icerik.form-modu{padding-block:18px 128px}
.alt-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--yuzey);border-top:1px solid var(--cizgi);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.alt-nav a,.alt-nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;font-weight:600;color:var(--soluk);border-radius:var(--r-k);cursor:pointer;min-width:0}
.alt-nav .secili{color:var(--ana)}
.alt-nav .yeni-dugme{color:var(--ana-ustu);background:var(--ana);margin:-2px 8px 0;border-radius:var(--r)}
.marka{font-family:var(--f-baslik);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;color:var(--ana)}
.ust-cubuk{display:flex;align-items:center;justify-content:space-between;gap:12px}
@media (min-width:900px){
  .kabuk{grid-template-columns:236px minmax(0,1fr)}
  .yan{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;padding:22px 14px;background:var(--yuzey);border-right:1px solid var(--cizgi);overflow:auto}
  .yan .marka{padding:0 10px 14px}
  .yan a.oge{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-k);font-weight:600;color:var(--soluk)}
  .yan a.oge:hover{background:var(--yuzey2);color:var(--murekkep)}
  .yan a.oge.secili{background:var(--ana-acik);color:var(--ana)}
  .yan .magaza{margin-top:auto;padding:12px;border-top:1px solid var(--cizgi);font-size:14px;color:var(--soluk)}
  .yan .magaza strong{display:block;color:var(--murekkep);font-size:15px}
  .alt-nav{display:none}
  .icerik{padding-inline:32px;padding-block:28px 48px}
  .icerik.form-modu{padding-block:28px 120px}
  .mobil-marka{display:none}
}

/* ---------- düğmeler ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-k);border:1px solid transparent;background:var(--ana);color:var(--ana-ustu);font-weight:600;font-size:16px;cursor:pointer;text-align:center;line-height:1.2}
.btn:hover{background:var(--ana-koyu)}
.btn.ikincil{background:var(--yuzey);color:var(--murekkep);border-color:var(--cizgi)}
.btn.ikincil:hover{background:var(--yuzey2)}
.btn.yumusak{background:var(--ana-acik);color:var(--ana)}
.btn.yumusak:hover{background:var(--ana-acik);filter:brightness(.97)}
.btn.tehlike{background:var(--yuzey);color:var(--kirmizi);border-color:var(--cizgi)}
.btn.tehlike:hover{background:var(--kirmizi-z)}
.btn.buyuk{min-height:56px;font-size:17px;padding:0 22px}
.btn.kucuk-b{min-height:40px;padding:0 12px;font-size:15px}
.btn.tam{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.dugmeler{display:flex;flex-wrap:wrap;gap:10px}
.dugmeler>.btn{flex:1 1 150px}
.baglanti{background:none;border:0;padding:0;color:var(--ana);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.geri{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:8px 8px 8px 0;font-weight:600;color:var(--soluk);cursor:pointer}

/* ---------- yüzeyler ---------- */
.kart{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kart.vurgu{border-color:var(--ana);background:var(--ana-acik)}
.kart-bas{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bolum{display:flex;flex-direction:column;gap:10px;min-width:0}
.bolum-bas{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.iki{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.iki{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.bos{padding:26px 16px;text-align:center;color:var(--soluk);border:1px dashed var(--cizgi);border-radius:var(--r)}
.serit{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--amber-z);color:var(--amber);font-size:15px;flex-wrap:wrap}
.serit.kirmizi{background:var(--kirmizi-z);color:var(--kirmizi)}
.serit.yesil{background:var(--ana-acik);color:var(--ana)}
.serit>div{flex:1 1 220px;min-width:0}
.serit .roller{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.serit .roller button{background:var(--yuzey);border:1px solid var(--cizgi);color:var(--murekkep);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600;cursor:pointer}
.serit .roller button.secili{background:var(--amber);color:var(--yuzey);border-color:var(--amber)}

/* ---------- liste ---------- */
.liste{display:flex;flex-direction:column;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:var(--r);overflow:hidden}
.satir{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--cizgi);min-width:0;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.satir:last-child{border-bottom:0}
.satir:hover{background:var(--yuzey2)}
.satir-ana{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.satir-ust{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.satir-ust strong{font-size:17px;font-weight:600}
.satir-alt{font-size:14px;color:var(--soluk);overflow-wrap:anywhere}
.satir-sag{text-align:right;flex:none;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.tutar{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rozet{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--yuzey2);color:var(--soluk)}
.rozet.amber{background:var(--amber-z);color:var(--amber)}
.rozet.kirmizi{background:var(--kirmizi-z);color:var(--kirmizi)}
.rozet.mavi{background:var(--mavi-z);color:var(--mavi)}
.rozet.yesil{background:var(--ana-acik);color:var(--ana)}
.kucuk-resim{width:56px;height:56px;border-radius:var(--r-k);object-fit:cover;background:var(--yuzey2);flex:none;display:grid;place-items:center;color:var(--soluk)}
.sekmeler{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sekmeler::-webkit-scrollbar{display:none}
.sekme{flex:none;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:99px;padding:9px 14px;font-weight:600;font-size:15px;color:var(--soluk);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.sekme.secili{background:var(--murekkep);color:var(--zemin);border-color:var(--murekkep)}
.sekme .adet{font-variant-numeric:tabular-nums;opacity:.75}

/* ---------- form ---------- */
.alan{display:flex;flex-direction:column;gap:6px;min-width:0}
.alan>span{font-size:14px;font-weight:600;color:var(--soluk)}
.alan small{font-size:13px;color:var(--soluk)}
.giris,select.giris,textarea.giris{width:100%;min-height:50px;padding:12px 14px;border:1px solid var(--cizgi);border-radius:var(--r-k);background:var(--yuzey);font-size:16px;min-width:0}
textarea.giris{min-height:96px;resize:vertical;line-height:1.4}
.giris:focus{outline:none;border-color:var(--ana);box-shadow:0 0 0 3px var(--ana-acik)}
.giris::placeholder{color:var(--soluk);opacity:.7}
.alanlar{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.alanlar.cift{grid-template-columns:repeat(2,minmax(0,1fr))}}
.arama{position:relative}
.arama .ik{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--soluk);pointer-events:none}
.arama .giris{padding-left:44px}
.ikili-sec{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--cizgi);border-radius:var(--r-k);overflow:hidden;background:var(--yuzey)}
.ikili-sec button{background:none;border:0;padding:0 16px;min-height:50px;font-weight:600;color:var(--soluk);cursor:pointer}
.ikili-sec button.secili{background:var(--murekkep);color:var(--zemin)}
.cipler{display:flex;flex-wrap:wrap;gap:8px}
.cip{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:99px;padding:9px 14px;font-weight:600;font-size:15px;cursor:pointer;color:var(--murekkep)}
.cip.secili{background:var(--ana);color:var(--ana-ustu);border-color:var(--ana)}
.adet-sec{display:inline-flex;align-items:center;border:1px solid var(--cizgi);border-radius:var(--r-k);overflow:hidden;background:var(--yuzey)}
.adet-sec button{width:44px;height:44px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--murekkep)}
.adet-sec span{min-width:32px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.foto-al{display:grid;place-items:center;gap:6px;min-height:150px;border:2px dashed var(--cizgi);border-radius:var(--r);background:var(--yuzey2);color:var(--soluk);font-weight:600;cursor:pointer;text-align:center;padding:14px;overflow:hidden;position:relative}
.foto-al img{max-height:220px;border-radius:var(--r-k)}
.foto-al input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.onay{display:flex;gap:10px;align-items:center;font-weight:500;cursor:pointer}
.onay input{width:22px;height:22px;accent-color:var(--ana)}

/* ---------- teklif kalemleri ---------- */
.kalem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--cizgi);align-items:center;min-width:0}
.kalem:last-child{border-bottom:0}
.kalem .kucuk-resim{width:64px;height:64px}
.kalem-ana{flex:1;min-width:0}
.kalem-ana strong{display:block;font-weight:600;overflow-wrap:anywhere}
.toplamlar{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.toplamlar>div{display:flex;justify-content:space-between;gap:12px}
.toplamlar .genel{font-size:20px;font-weight:700;font-family:var(--f-baslik);padding-top:8px;border-top:1px solid var(--cizgi)}
.alt-cubuk{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--yuzey);border-top:1px solid var(--cizgi);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;justify-content:space-between}
.alt-cubuk .btn{flex:0 1 260px}
@media (min-width:900px){.alt-cubuk{left:236px;padding-inline:32px}}

/* ---------- aşamalar ---------- */
.asamalar{display:flex;flex-direction:column}
.asama{display:flex;align-items:center;gap:12px;padding:9px 6px;background:none;border:0;text-align:left;cursor:pointer;border-radius:var(--r-k);color:var(--soluk);font-weight:500;width:100%;position:relative}
button.asama:hover{background:var(--yuzey2)}
div.asama{cursor:default}
.asama .nokta{width:26px;height:26px;border-radius:50%;border:2px solid var(--cizgi);display:grid;place-items:center;flex:none;background:var(--yuzey);color:var(--ana-ustu)}
.asama.gecti .nokta{background:var(--ana);border-color:var(--ana)}
.asama.gecti{color:var(--murekkep)}
.asama.simdi{color:var(--murekkep);font-weight:700}
.asama.simdi .nokta{box-shadow:0 0 0 4px var(--ana-acik)}

/* ---------- rakam kutuları ---------- */
.rakamlar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.rakamlar{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rakam{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:var(--r);padding:14px;min-width:0}
.rakam b{display:block;font-family:var(--f-baslik);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.rakam span{font-size:14px;color:var(--soluk)}
.cubuk-satir{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--cizgi)}
.cubuk-satir:last-child{border-bottom:0}
.cubuk{grid-column:1/-1;height:8px;border-radius:99px;background:var(--yuzey2);overflow:hidden}
.cubuk i{display:block;height:100%;background:var(--ana);border-radius:99px}
.tablo-sar{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--cizgi);white-space:nowrap}
th{font-size:13px;color:var(--soluk);text-transform:uppercase;letter-spacing:.05em}
td.sag,th.sag{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- gün başlıkları ---------- */
.gun-bas{display:flex;align-items:baseline;gap:10px;padding-top:6px}
.gun-bas h2{font-size:18px}
.bilgi-satir{display:flex;gap:10px;align-items:flex-start;font-size:15px;min-width:0}
.bilgi-satir .ik{color:var(--soluk);margin-top:2px}
.bilgi-satir>span{min-width:0;overflow-wrap:anywhere}
.gecmis{display:flex;flex-direction:column;gap:10px}
.gecmis div{font-size:15px;padding-left:14px;border-left:2px solid var(--cizgi)}
.gecmis small{display:block;color:var(--soluk);font-size:13px}

/* ---------- modal + toast ---------- */
.perde{position:fixed;inset:0;z-index:50;background:var(--perde);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--yuzey);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;box-shadow:var(--golge)}
.modal-bas{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kapat{background:var(--yuzey2);border:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--murekkep);flex:none}
@media (min-width:640px){.perde{align-items:center;padding:24px}.modal{border-radius:18px;padding:22px}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
#toast div{background:var(--murekkep);color:var(--zemin);padding:12px 18px;border-radius:99px;font-weight:600;font-size:15px;box-shadow:var(--golge);text-align:center}
#toast div.hata{background:var(--kirmizi);color:var(--yuzey)}

/* ---------- giriş ---------- */
.giris-sayfa{min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:32px}
.giris-kutu{width:100%;max-width:440px;display:flex;flex-direction:column;gap:20px}
.giris-kutu .marka{font-size:30px}
.yukleniyor{min-height:60dvh;display:grid;place-items:center;color:var(--soluk);font-weight:600}

/* ---------- müşteri teklif sayfası ---------- */
.m-sayfa{max-width:760px;margin-inline:auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
.m-onizleme{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--murekkep);color:var(--zemin);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:15px}
.m-onizleme a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.m-bas{display:flex;align-items:center;gap:14px}
.m-logo{width:60px;height:60px;border-radius:var(--r);object-fit:contain;background:var(--yuzey);border:1px solid var(--cizgi);flex:none}
.m-logo.harf{display:grid;place-items:center;background:var(--ana);color:var(--ana-ustu);font-family:var(--f-baslik);font-weight:700;font-size:26px;border:0}
.m-urunler{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.m-urunler{grid-template-columns:repeat(2,minmax(0,1fr))}}
.m-urun{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.m-urun .gorsel{aspect-ratio:4/3;background:var(--yuzey2);display:grid;place-items:center;color:var(--soluk);max-width:100%}
.m-urun .gorsel img{width:100%;height:100%;object-fit:cover}
.m-urun .govde{padding:14px;display:flex;flex-direction:column;gap:4px}

const VARS_KVKK = 'Adınız ve telefon numaranız yalnızca teklif hazırlamak, siparişinizi takip etmek ve sizinle iletişim kurmak amacıyla mağazamız tarafından işlenir. Bilgileriniz üçüncü kişilerle paylaşılmaz. Bilgilerinizin silinmesini mağazamızdan talep edebilirsiniz.';

const kopya = v => JSON.parse(JSON.stringify(v === undefined ? null : v));
const rastgele = (n = 20) => { const h = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < n; i++) s += h[Math.floor(Math.random() * h.length)]; return s; };
const gunStr = (d = new Date()) => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const gunEkle = (n, bas) => { const x = bas ? new Date(bas + 'T12:00:00') : new Date(); x.setDate(x.getDate() + n); return gunStr(x); };

function yolYaz(nesne, yol, deger) {
  const p = yol.split('.'); let o = nesne;
  for (let i = 0; i < p.length - 1; i++) { if (o[p[i]] == null || typeof o[p[i]] !== 'object') o[p[i]] = {}; o = o[p[i]]; }
  o[p[p.length - 1]] = deger;
}
function yolOku(nesne, yol) { return yol.split('.').reduce((o, k) => (o == null ? undefined : o[k]), nesne); }
/* {set:{'a.b':1}, push:{'log':x}} değişikliğini bir kopyaya uygular */
function degisiklikUygula(q, deg) {
  const y = kopya(q);
  for (const k in (deg.set || {})) yolYaz(y, k, kopya(deg.set[k]));
  for (const k in (deg.push || {})) { const d = yolOku(y, k); const dizi = Array.isArray(d) ? d : []; dizi.push(kopya(deg.push[k])); yolYaz(y, k, dizi); }
  return y;
}

/* ---------------- deneme arka ucu ---------------- */
function yerelArka() {
  const ANAHTAR = 'sedir-deneme-v1';
  let d = null, authCb = null;
  const din = {};
  try { const x = JSON.parse(localStorage.getItem(ANAHTAR) || 'null'); if (x && x.surum === 1 && (x.degisti || x.tohum === gunStr())) d = x; } catch (e) { /* bellek kapalı olabilir */ }
  if (!d) d = ornekVeri();
  const ben = () => d.users.find(u => u.uid === d.aktif);
  const oturum = () => { const u = ben(); return u ? { uid: u.uid, email: u.email, user: kopya(u), storeId: 'ornek', admin: false } : null; };
  const veri = {
    store: () => d.store,
    users: () => d.users,
    products: () => d.products,
    quotes: () => { const u = ben(); if (!u) return []; if (u.role === 'danisman') return d.quotes.filter(q => q.createdBy === u.uid); if (u.role === 'teslimat') return d.quotes.filter(q => q.status === 'kazanildi'); return d.quotes; },
    views: () => { const m = {}; for (const k in d.pub) m[k] = { views: d.pub[k].views || 0, last: d.pub[k].lastView || 0 }; return m; }
  };
  const yay = tur => (din[tur] || []).forEach(f => f(kopya(veri[tur]())));
  const yaz = (...turler) => { d.degisti = true; try { localStorage.setItem(ANAHTAR, JSON.stringify(d)); } catch (e) { /* yoksay */ } turler.forEach(yay); };
  const tamPub = id => {
    const q = d.quotes.find(x => x.id === id); if (!q) return null;
    return q._pub ? kopya(q._pub) : null;
  };
  return {
    mod: 'deneme',
    onAuth(cb) { authCb = cb; setTimeout(() => cb(oturum()), 0); },
    async signIn() { d.aktif = 'u1'; yaz(); authCb(oturum()); },
    async signUp() { throw new Error('Deneme modunda kayıt yapılamaz'); },
    async completeSignUp() {},
    async signOut() { d.aktif = null; authCb(null); },
    async resetPass() {},
    demoRol(uid) { d.aktif = uid; try { localStorage.setItem(ANAHTAR, JSON.stringify(d)); } catch (e) { /* yoksay */ } authCb(oturum()); },
    demoSifirla() { try { localStorage.removeItem(ANAHTAR); } catch (e) { /* yoksay */ } d = ornekVeri(); authCb(oturum()); },
    watch(tur, cb) { (din[tur] = din[tur] || []).push(cb); setTimeout(() => cb(kopya(veri[tur]())), 0); return () => { din[tur] = (din[tur] || []).filter(f => f !== cb); }; },
    newId: () => rastgele(20),
    async nextNo() { d.sayac = (d.sayac || 0) + 1; return d.sayac; },
    async setQuote(id, q, pub) { const y = Object.assign(kopya(q), { id, _pub: kopya(pub) }); const i = d.quotes.findIndex(x => x.id === id); if (i >= 0) d.quotes[i] = y; else d.quotes.push(y); yaz('quotes'); },
    async updateQuote(id, deg, pub) { const i = d.quotes.findIndex(x => x.id === id); if (i < 0) return; const y = degisiklikUygula(d.quotes[i], deg); if (pub) y._pub = kopya(pub); d.quotes[i] = y; yaz('quotes'); },
    async deleteQuote(id) { d.quotes = d.quotes.filter(x => x.id !== id); delete d.pub[id]; yaz('quotes', 'views'); },
    async setProduct(id, p) { const y = Object.assign(kopya(p), { id }); const i = d.products.findIndex(x => x.id === id); if (i >= 0) d.products[i] = y; else d.products.push(y); yaz('products'); },
    async deleteProduct(id) { d.products = d.products.filter(x => x.id !== id); yaz('products'); },
    async putPhoto(data) { const id = 'f-' + rastgele(12); d.photos[id] = data; yaz(); return id; },
    async getPhoto(id) { return d.photos[id] || ''; },
    async updateStore(yama) { Object.assign(d.store, kopya(yama)); yaz('store'); },
    async addStaff({ name, email, role }) { d.users.push({ uid: 'u-' + rastgele(8), name, email, role, active: true, storeId: 'ornek', createdAt: Date.now() }); yaz('users'); },
    async updateUser(uid, yama) { const u = d.users.find(x => x.uid === uid); if (u) Object.assign(u, yama); yaz('users'); },
    async getPublic(id) { return tamPub(id); },
    async adminStores() { return []; },
    async adminUpdateStore() {}
  };
}

/* ---------------- canlı arka uç (Firebase) ---------------- */
function betik(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('yuklenemedi')); document.head.appendChild(s); }); }

function canliArka() {
  let fb, auth, db, FV, authCb = null, ot = null, kayitta = false, ilkCoz;
  const ilk = new Promise(r => { ilkCoz = r; });
  const hazir = (async () => {
    if (!window.firebase || !window.firebase.firestore) for (const f of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js']) await betik(SDK + f);
    fb = window.firebase; fb.initializeApp(AYAR.firebase); auth = fb.auth(); db = fb.firestore(); FV = fb.firestore.FieldValue;
    auth.onAuthStateChanged(u => { ilkCoz(); if (!kayitta) yukle(u); });
  })();
  const temiz = v => JSON.parse(JSON.stringify(v));
  const M = () => db.collection('stores').doc(ot.storeId);

  async function yukle(u) {
    if (!u) { ot = null; if (authCb) authCb(null); return; }
    try {
      const [k, a] = await Promise.all([
        db.collection('users').doc(u.uid).get(),
        db.collection('admins').doc(u.uid).get().then(s => s.exists).catch(() => false)
      ]);
      if (k.exists) ot = { uid: u.uid, email: u.email, user: Object.assign({ uid: u.uid }, k.data()), storeId: k.data().storeId, admin: a };
      else ot = { uid: u.uid, email: u.email, user: null, storeId: null, admin: a, eksik: !a };
    } catch (e) { ot = { uid: u.uid, email: u.email, user: null, storeId: null, admin: false, hata: e.code || String(e) }; }
    if (authCb) authCb(ot);
  }
  async function magazaYaz(uid, email, { storeName, name, phone }) {
    const ref = db.collection('stores').doc(); const simdi = Date.now(); const b = db.batch();
    b.set(ref, { name: storeName, phone: phone || '', address: '', logo: '', ownerUid: uid, ownerName: name, ownerEmail: email, plan: 'deneme', paidUntil: simdi + AYAR.denemeGun * GUN, createdAt: simdi, validDays: 7, followDays: 3, terms: VARS_SARTLAR, kvkk: VARS_KVKK, msgQuote: '' });
    b.set(db.collection('users').doc(uid), { storeId: ref.id, name, email, role: 'sahip', active: true, createdAt: simdi });
    await b.commit();
  }

  return {
    mod: 'canli',
    onAuth(cb) { authCb = cb; hazir.catch(e => cb({ hata: 'baglanti', ayrinti: String(e && e.message || e) })); },
    async signIn(email, pass) { await hazir; await auth.signInWithEmailAndPassword(email, pass); },
    async signUp(v) {
      await hazir; kayitta = true;
      try { const c = await auth.createUserWithEmailAndPassword(v.email, v.pass); await magazaYaz(c.user.uid, v.email, v); }
      finally { kayitta = false; if (auth.currentUser) await yukle(auth.currentUser); }
    },
    async completeSignUp(v) { await magazaYaz(ot.uid, ot.email, v); await yukle(auth.currentUser); },
    async signOut() { await auth.signOut(); },
    async resetPass(email) { await hazir; await auth.sendPasswordResetEmail(email); },
    watch(tur, cb) {
      const sid = ot.storeId, rol = ot.user.role;
      const hata = e => console.warn('Sedir izleme hatası:', tur, e && e.code || e);
      const liste = (s, anahtar) => s.docs.map(x => Object.assign({ [anahtar]: x.id }, x.data()));
      if (tur === 'store') return M().onSnapshot(s => cb(s.exists ? Object.assign({ id: s.id }, s.data()) : null), hata);
      if (tur === 'users') return db.collection('users').where('storeId', '==', sid).onSnapshot(s => cb(liste(s, 'uid')), hata);

function gorselKucult(dosya, enBuyuk, hedef, tur) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('Fotoğraf okunamadı'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Fotoğraf açılamadı'));
      img.onload = () => {
        const o = Math.min(1, enBuyuk / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * o)); c.height = Math.max(1, Math.round(img.height * o));
        const x = c.getContext('2d');
        if (tur === 'png') { x.drawImage(img, 0, 0, c.width, c.height); const p = c.toDataURL('image/png'); if (p.length <= hedef) return res(p); }
        x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        let k = 0.82, u = c.toDataURL('image/jpeg', k);
        while (u.length > hedef && k > 0.35) { k -= 0.1; u = c.toDataURL('image/jpeg', k); }
        res(u);
      };
      img.src = r.result;
    };
    r.readAsDataURL(dosya);
  });
}

/* ---------------- Rapor ---------------- */
function aralik(k) {
  const s = new Date(); s.setHours(0, 0, 0, 0);
  if (k === 'gecen') return [new Date(s.getFullYear(), s.getMonth() - 1, 1).getTime(), new Date(s.getFullYear(), s.getMonth(), 1).getTime()];
  if (k === '90') return [Date.now() - 90 * GUN, Infinity];
  s.setDate(1); return [s.getTime(), Infinity];
}
function raporG() {
  const [t0, t1] = aralik(A.rapor);
  const ic = t => t >= t0 && t < t1;
  const verilen = D.quotes.filter(q => ic(q.createdAt));
  const donen = D.quotes.filter(q => q.status === 'kazanildi' && ic(q.wonAt));
  const ciro = donen.reduce((t, q) => t + q.total, 0);
  const tahsil = D.quotes.reduce((t, q) => t + ((q.order && q.order.payments) || []).filter(p => ic(p.at)).reduce((a, p) => a + (+p.amount || 0), 0), 0);
  const acik = D.quotes.filter(q => q.status === 'acik');
  const bakiye = D.quotes.filter(q => q.status === 'kazanildi').reduce((t, q) => t + kalan(q), 0);

  const kl = Object.values(kisiler).sort((x, y) => y.ciro - x.ciro || y.teklif - x.teklif);
  const enCok = Math.max(1, ...kl.map(k => k.ciro));
  const nedenler = {}; verilen.filter(q => q.status === 'kaybedildi').forEach(q => { const n = q.lostReason || 'Belirtilmedi'; nedenler[n] = (nedenler[n] || 0) + 1; });
  const nl = Object.entries(nedenler).sort((x, y) => y[1] - x[1]);
  const kazanilanVerilen = verilen.filter(q => q.status === 'kazanildi').length;
  const sekme = (k, ad) => `<button class="sekme ${A.rapor === k ? 'secili' : ''}" data-is="rapor-aralik" data-k="${k}">${ad}</button>`;
  return `${sayfaBas('Rapor', `<button class="btn ikincil kucuk-b" data-is="csv">${ik('indir', 18)} Excel'e aktar</button>`)}
    <div class="sekmeler">${sekme('ay', 'Bu ay')}${sekme('gecen', 'Geçen ay')}${sekme('90', 'Son 90 gün')}</div>
    <div class="rakamlar">
      <div class="rakam"><b>${verilen.length}</b><span>verilen teklif</span></div>
      <div class="rakam"><b>${donen.length}</b><span>siparişe dönen</span></div>
      <div class="rakam"><b>${verilen.length ? '%' + Math.round(kazanilanVerilen / verilen.length * 100) : '–'}</b><span>kapanma oranı</span></div>
      <div class="rakam"><b>${para(ciro)}</b><span>sipariş cirosu</span></div>
      <div class="rakam"><b>${para(tahsil)}</b><span>tahsil edilen</span></div>
      <div class="rakam"><b>${para(bakiye)}</b><span>bekleyen bakiye (şu an)</span></div>
      <div class="rakam"><b>${acik.length}</b><span>açık teklif (şu an)</span></div>
      <div class="rakam"><b>${para(acik.reduce((t, q) => t + q.total, 0))}</b><span>açık teklif tutarı</span></div>
    </div>

/* ============================================================
   İşlemler: tıklamalar, formlar, başlangıç
   ============================================================ */
async function guncelle(id, deg, mesaj) {
  const q = D.quotes.find(x => x.id === id); if (!q) return false;
  if (!aktifMi()) { toast('Abonelik süresi doldu. Değişiklik için aboneliği yenileyin.', true); return false; }
  deg.set = Object.assign({ updatedAt: Date.now() }, deg.set || {});
  const yeni = degisiklikUygula(q, deg);
  await B.updateQuote(id, deg, herkeseAcik(yeni));
  if (mesaj) toast(mesaj);
  return true;
}
function kalemAc(idx) {
  A.kalemIdx = idx; A.kalemAra = '';
  if (idx >= 0) { const i = A.taslak.items[idx]; A.kalem = { name: i.name, variant: i.variant || '', qty: +i.qty || 1, price: String(i.price || ''), photoId: i.photoId || '', productId: i.productId || '', fotoVeri: '', kucuk: '', kaydet: false }; A.kalemAdim = 'form'; }
  else { A.kalem = { name: '', variant: '', qty: 1, price: '', photoId: '', productId: '', fotoVeri: '', kucuk: '', kaydet: true }; A.kalemAdim = D.products.length ? 'liste' : 'form'; }
  modalAc(kalemModalHtml());
}
async function teklifKaydet(btn) {
  const t = A.taslak; if (!t) return;
  const ad = (t.customer.name || '').trim();
  if (!ad) { toast('Müşterinin adını yazın.', true); const a = $('#t-ad'); if (a) a.focus(); return; }
  if (!t.items.length) { toast('En az bir ürün ekleyin.', true); return; }
  if (!aktifMi()) { toast('Abonelik süresi doldu. Yeni teklif için aboneliği yenileyin.', true); return; }
  mesgul(btn, true);
  try {
    const h = hesap(t), simdi = Date.now(), u = D.ot.user;
    const alanlar = {
      customer: { name: ad, phone: (t.customer.phone || '').trim() },
      items: t.items.map(i => ({ name: i.name, variant: i.variant || '', qty: +i.qty || 1, price: +i.price || 0, photoId: i.photoId || '', productId: i.productId || '' })),
      discountType: t.discountType === 'yuzde' ? 'yuzde' : 'tl', discountVal: sayi(t.discountVal),
      subtotal: h.ara, discount: h.ind, total: h.toplam, note: (t.note || '').trim(), internalNote: (t.internalNote || '').trim(),
      validUntil: t.validUntil || '', followUpAt: t.followUpAt || '', updatedAt: simdi
    };
    let id = t.id, q;
    if (id) {
      const eski = D.quotes.find(x => x.id === id); if (!eski) throw new Error('Teklif bulunamadı');
      q = Object.assign(kopya(eski), alanlar);
      q.log = (q.log || []).concat([kayit('Teklif düzenlendi')]);
    } else {
      id = B.newId();
      q = Object.assign({ no: await B.nextNo(), status: 'acik', lostReason: '', createdBy: D.ot.uid, createdByName: u.name, createdAt: simdi, sentAt: 0, wonAt: 0, log: [kayit('Teklif oluşturuldu')], order: null }, alanlar);
    }
    delete q.id; delete q._pub;
    await B.setQuote(id, q, herkeseAcik(Object.assign({ id }, q)));
    A.taslak = null; A.taslakId = undefined;
    toast(t.id ? 'Değişiklikler kaydedildi' : 'Teklif kaydedildi. Şimdi müşteriye gönderin.');
    if (t.id && yigin.length > 1 && yigin[yigin.length - 2] === '#teklif-' + id) history.back();
    else git('teklif-' + id, true);
  } finally { mesgul(btn, false); }
}
function csvIndir() {
  const b = ['No', 'Tarih', 'Müşteri', 'Telefon', 'Danışman', 'Durum', 'Ürünler', 'Toplam', 'Alınan', 'Kalan', 'Teslimat'];
  const h = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const s = D.quotes.slice().sort((x, y) => y.createdAt - x.createdAt).map(q => [teklifNo(q.no), gunStr(new Date(q.createdAt)), q.customer.name, q.customer.phone, q.createdByName, durum(q).etiket, q.items.map(i => i.name).join(', '), q.total, q.status === 'kazanildi' ? odenen(q) : '', q.status === 'kazanildi' ? kalan(q) : '', (q.order && q.order.deliveryDate) || ''].map(h).join(';'));
  const blob = new Blob(['﻿' + [b.map(h).join(';')].concat(s).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'teklifler-' + gunStr() + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Dosya hazırlandı');
}

/* Tarayıcı geçmişi yerine kendi yığınımız: sayfa yenilendiğinde ya da gömülü açıldığında "Geri" uygulamadan çıkarmaz */
const yigin = [location.hash];
let yerineYaz = false;
function geriGit() {
  if (yigin.length > 1) { history.back(); return; }
  const r = rotaOku(), q = D.quotes.find(x => x.id === r.id);
  const rol = D.ot && D.ot.user ? D.ot.user.role : '';
  git(rol === 'teslimat' && r.ad !== 't' ? 'teslimat' : ((r.ad === 'duzenle' || r.ad === 't') && q ? 'teklif-' + r.id : (q && q.status === 'kazanildi' ? 'siparisler' : 'teklifler')), true);
}
function git(hash, degistir) {
  if (degistir) { yerineYaz = true; location.replace('#' + hash); }
  else location.hash = hash;
}

const FORMLAR = {
  giris: v => B.signIn(v.email.trim(), v.pass),
  kayit: v => B.signUp({ storeName: v.storeName.trim(), name: v.name.trim(), phone: v.phone.trim(), email: v.email.trim(), pass: v.pass }),
  tamamla: v => B.completeSignUp({ storeName: v.storeName.trim(), name: v.name.trim(), phone: v.phone.trim() }),
  sifre: async v => { await B.resetPass(v.email.trim()); toast('Sıfırlama bağlantısı gönderildi'); A.girisMod = 'giris'; ciz(); },
  arandi: async v => {
    const not = (v.not || '').trim();
    const ok = await guncelle(v.id, { set: { followUpAt: v.tarih || '' }, push: { log: kayit('Arandı' + (not ? ': ' + not : '') + (v.tarih ? ' (sonraki arama ' + tarih(v.tarih) + ')' : '')) } }, 'Arama notu kaydedildi');
    if (ok) modalKapat();
  },
  siparis: async v => {
    const kapora = sayi(v.kapora), q = D.quotes.find(x => x.id === v.id); if (!q) return;
    const siparis = { stage: 'siparis', deliveryDate: v.tarih || '', slot: '', address: (v.adres || '').trim(), team: '', note: '', payments: kapora > 0 ? [{ at: Date.now(), amount: kapora, method: v.sekil || 'Nakit', by: D.ot.user.name }] : [] };
    const ok = await guncelle(v.id, { set: { status: 'kazanildi', wonAt: Date.now(), followUpAt: '', order: siparis }, push: { log: kayit('Siparişe çevrildi' + (kapora > 0 ? ', kapora ' + para(kapora) : '')) } }, 'Sipariş oluşturuldu');
    if (ok) modalKapat();
  },
  kayip: async v => {
    const ok = await guncelle(v.id, { set: { status: 'kaybedildi', lostReason: (v.neden || '').trim(), followUpAt: '' }, push: { log: kayit('Kaybedildi' + (v.neden ? ': ' + v.neden.trim() : '')) } }, 'Kaydedildi');
    if (ok) modalKapat();
  },
  odeme: async v => {
    const tutar = sayi(v.tutar); const deg = { set: {}, push: {} };
    if (!(tutar > 0) && !v.teslim) { toast('Tutarı yazın.', true); return; }
    let metin = '';
    if (tutar > 0) { deg.push['order.payments'] = { at: Date.now(), amount: tutar, method: v.sekil || 'Nakit', by: D.ot.user.name }; metin = 'Ödeme alındı: ' + para(tutar) + ' (' + (v.sekil || 'Nakit') + ')'; }
    if (v.teslim) { deg.set['order.stage'] = 'teslim'; deg.set['order.deliveredAt'] = Date.now(); metin = (metin ? metin + '. ' : '') + 'Durum: Teslim edildi'; }
    deg.push.log = kayit(metin);
    const ok = await guncelle(v.id, deg, v.teslim ? 'Teslim edildi olarak işaretlendi' : 'Ödeme kaydedildi');
    if (ok) modalKapat();
  },
  teslimat: async v => {
    const q = D.quotes.find(x => x.id === v.id); if (!q) return;
    const set = { 'order.deliveryDate': v.tarih || '', 'order.slot': (v.saat || '').trim(), 'order.address': (v.adres || '').trim(), 'order.team': (v.ekip || '').trim(), 'order.note': (v.not || '').trim() };
    const degisti = (q.order || {}).deliveryDate !== set['order.deliveryDate'];
    const ok = await guncelle(v.id, { set, push: { log: kayit(degisti && v.tarih ? 'Teslimat günü: ' + tarih(v.tarih) : 'Teslimat bilgileri güncellendi') } }, 'Teslimat bilgileri kaydedildi');
    if (ok) modalKapat();
  },
  urun: async v => {
    const u = A.urun, ad = v.name.trim(), fiyat = sayi(v.price);
    if (!(fiyat > 0)) { toast('Fiyatı yazın.', true); return; }
    let photoId = u.photoId, thumb = u.thumb;
    if (u.fotoVeri) { photoId = await B.putPhoto(u.fotoVeri); fotoBellek.set(photoId, u.fotoVeri); thumb = u.kucuk; }
    await B.setProduct(u.id || B.newId(), { name: ad, price: fiyat, photoId, thumb, createdAt: u.createdAt });
    modalKapat(); toast('Ürün kaydedildi');
  },
  personel: async v => { await B.addStaff({ name: v.name.trim(), email: v.email.trim(), pass: v.pass, role: v.role === 'teslimat' ? 'teslimat' : 'danisman' }); modalKapat(); toast('Kişi eklendi'); },
  magaza: async v => { await B.updateStore({ name: v.name.trim(), phone: v.phone.trim(), whatsapp: v.whatsapp.trim(), address: v.address.trim() }); toast('Mağaza bilgileri kaydedildi'); },
  'teklif-ayar': async v => { await B.updateStore({ validDays: Math.max(1, Math.round(sayi(v.validDays)) || 7), followDays: Math.max(1, Math.round(sayi(v.followDays)) || 3), terms: v.terms.trim(), msgQuote: v.msgQuote.trim() === VARS_MESAJ ? '' : v.msgQuote.trim(), kvkk: v.kvkk.trim() }); toast('Teklif ayarları kaydedildi'); },
  hesap: async v => { await B.updateUser(D.ot.uid, { name: v.name.trim() }); D.ot.user.name = v.name.trim(); toast('Adınız kaydedildi'); }
};

function taslakToplam() { const t = A.taslak; if (!t) return; const k = $('#t-toplam'); if (k) k.innerHTML = toplamHtml(t); const a = $('#t-alt'); if (a) a.textContent = para(hesap(t).toplam); }

document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('perde')) { modalKapat(); return; }
  const el = e.target.closest('[data-is]'); if (!el) return;
  const is = ISLER[el.dataset.is]; if (!is) return;
  if (el.tagName !== 'A') e.preventDefault();
  Promise.resolve().then(() => is(el, e)).catch(hataGoster);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f).entries());
  const btn = f.querySelector('button[type=submit]');
  mesgul(btn, true);
  Promise.resolve().then(() => FORMLAR[f.dataset.form](v, f)).catch(hataGoster).finally(() => mesgul(btn, false));
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.t && A.taslak) { yolYaz(A.taslak, el.dataset.t, el.value); if (el.dataset.t === 'discountVal') taslakToplam(); }
  else if (el.dataset.k && A.kalem) A.kalem[el.dataset.k] = el.value;
  else if (el.dataset.in === 'ara') { A.ara = el.value; const k = $('#liste-kap'); if (k) k.innerHTML = teklifListeHtml(); }
  else if (el.dataset.in === 'urun-ara') { A.urunAra = el.value; const k = $('#liste-kap'); if (k) k.innerHTML = urunListeHtml(); }
  else if (el.dataset.in === 'kalem-ara') { A.kalemAra = el.value; const k = $('#kalem-liste'); if (k) k.innerHTML = kalemListeHtml(); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  try {
    if (el.dataset.kc && A.kalem) { A.kalem[el.dataset.kc] = el.checked; return; }
    if (el.dataset.degis === 'rol') { await B.updateUser(el.dataset.uid, { role: el.value }); toast('Görev güncellendi'); return; }
    if (el.dataset.degis === 'plan') { const m = (A.magazalar || []).find(x => x.id === el.dataset.id); await B.adminUpdateStore(el.dataset.id, { plan: el.value }); if (m) m.plan = el.value; toast('Paket güncellendi'); ciz(); return; }
    if (el.dataset.dosya && el.files && el.files[0]) {
      const dosya = el.files[0], tur = el.dataset.dosya;
      if (tur === 'logo') { const logo = await gorselKucult(dosya, 240, 110000, 'png'); await B.updateStore({ logo }); toast('Logo kaydedildi'); return; }
      const [buyuk, kucuk] = await Promise.all([gorselKucult(dosya, 900, 120000), gorselKucult(dosya, 160, 9000)]);
      const hedef = tur === 'kalem' ? A.kalem : A.urun; if (!hedef) return;
      hedef.fotoVeri = buyuk; hedef.kucuk = kucuk;
      if (tur === 'urun') { const a = $('#ur-ad'), f = $('#ur-fiyat'); if (a) hedef.name = a.value; if (f) hedef.price = f.value; }
      modalAc(tur === 'kalem' ? kalemModalHtml() : urunModalHtml());
    }
  } catch (err) { hataGoster(err); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') modalKapat(); });
window.addEventListener('hashchange', () => {
  const h = location.hash;
  if (yerineYaz) { yigin[yigin.length - 1] = h; yerineYaz = false; }
  else if (yigin.length > 1 && yigin[yigin.length - 2] === h) yigin.pop();
  else yigin.push(h);
  modalKapat(); document.title = AYAR.uygulamaAdi; ciz(); window.scrollTo(0, 0);
});

/* ---------------- başlangıç ---------------- */
document.title = AYAR.uygulamaAdi;
B.onAuth(ot => {
  D.kop.forEach(f => { try { f(); } catch (e) { /* yoksay */ } });
  D.kop = []; D.yuk = {}; D.ot = ot; if (ot) A.girisMod = 'giris'; D.store = null; D.users = []; D.quotes = []; D.products = []; D.views = {};
  if (ot && ot.user && ot.user.active !== false) {
    const rol = ot.user.role;
    const izle = (tur, ata) => D.kop.push(B.watch(tur, v => { ata(v); D.yuk[tur] = true; veriGeldi(); }));
    izle('store', v => { D.store = v; });
    izle('quotes', v => { D.quotes = v || []; });
    if (rol !== 'teslimat') { izle('products', v => { D.products = v || []; }); izle('views', v => { D.views = v || {}; }); }
    if (rol === 'sahip') izle('users', v => { D.users = v || []; });
  }
  ciz();
});
